name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(add|fix|delete|feat|docs|chore|refactor|test):\s.+/i;

            if (!pattern.test(title)) {
              core.setFailed(
                "PR title must follow '<type>: <summary>' and start with one of: add, fix, delete, feat, docs, chore, refactor, test."
              );
            }
